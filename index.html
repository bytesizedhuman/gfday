
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Duck Hunt - Girlfriend Day</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#end{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center}
.card{background:#fff8fb;padding:28px;border-radius:18px;max-width:430px;text-align:center;font-family:Arial}
button{padding:10px 18px;border:none;border-radius:10px;background:#ff5b99;color:#fff;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="end"><div class="card">
<h2>🎁 Happy Girlfriend's Day Cutieeeee💕</h2>

<p>
You caught all the love ducks ;)!<br><br>

May your life always be filled with warm hugs, happy memories and endless smiles.<br><br>

I'm sooo happy to be your man.<br><br>
With love,<br>
Your Kuchu Puchu 💖🌸
</p>
<button onclick="location.reload()">Play Again</button>
</div></div>
<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();onresize=rs;
let score=0,ducks=[],dogState="peek",dogTimer=90;
function spawn(){
 let side=Math.random()<.5?-60:cv.width+60;
 ducks.push({x:side,y:90+Math.random()*220,vx:side<0?3:-3,vy:(Math.random()-.5)*1.6});
}
function px(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h);}
function tree(x){
 px(x,cv.height-240,30,180,"#6b4325");
 for(let i=0;i<5;i++)px(x-40+i*15,cv.height-280-(i%2)*20,80,70,"#2e8b57");
}
function dog(){
 let x=120,y=cv.height-105;
 if(dogState==="hide") return;
 px(x,y,42,26,"#b8865b");
 px(x+35,y-10,20,20,"#b8865b");
 px(x+48,y-5,6,6,"#000");
 px(x+18,y-18,14,18,"#ff7ab6");
 ctx.font="18px sans-serif";
 ctx.fillText("💐",x+15,y-22);
}
function duck(d){
 ctx.font="42px serif";
 ctx.fillText("🦆",d.x,d.y);
 ctx.font="16px serif";
 ctx.fillText("💖",d.x+10,d.y-12);
}
function bg(){
 ctx.fillStyle="#8fe6ff";ctx.fillRect(0,0,cv.width,cv.height);
 ctx.fillStyle="#fff";
 for(let i=0;i<6;i++){ctx.beginPath();ctx.arc((i*220+performance.now()/40)%(cv.width+100)-50,60+i%2*30,26,0,7);ctx.fill();}
 ctx.fillStyle="#79c95c";ctx.fillRect(0,cv.height-120,cv.width,120);
 for(let i=0;i<cv.width;i+=18){ctx.fillStyle="#3e8b3e";ctx.fillRect(i,cv.height-120-Math.random()*8,8,18);}
 tree(60);tree(cv.width-90);
 dog();
 ctx.fillStyle="rgba(255,255,255,.9)";
 ctx.fillRect(10,10,170,40);
 ctx.fillStyle="#ff4f91";
 ctx.font="20px Arial";
 ctx.fillText("💕 "+score+"/20",24,37);
}
function loop(){
 requestAnimationFrame(loop);
 bg();
 if(dogTimer>0){dogTimer--; if(dogTimer===0){dogState="hide";}}
 if(Math.random()<0.015 && ducks.length<3)spawn();
 ducks.forEach(d=>{d.x+=d.vx;d.y+=d.vy; if(d.y<50||d.y>280)d.vy*=-1; duck(d);});
 ducks=ducks.filter(d=>d.x>-80&&d.x<cv.width+80);
}
loop();
cv.addEventListener("pointerdown",e=>{
 let x=e.clientX,y=e.clientY;
 for(let i=ducks.length-1;i>=0;i--){
   let d=ducks[i];
   if(Math.hypot(x-d.x,y-d.y)<35){
      ducks.splice(i,1);
      score++;
      if(score>=20)document.getElementById("end").style.display="flex";
      return;
   }
 }
});
</script>
</body>
</html>
